<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Atlas Rewards — reconnecting</title>
  <style>
    body { margin:0; font-family:system-ui,sans-serif; background:#fff;
           display:flex; align-items:center; justify-content:center; min-height:100vh;
           padding-top: env(safe-area-inset-top, 0px); }
    .card { text-align:center; padding:2rem; max-width:320px; }
    button { margin-top:1.25rem; background:#0891b2; color:#fff; border:0; border-radius:12px;
             padding:.8rem 1.6rem; font-size:1rem; font-weight:700; }
    .spinner { width:36px; height:36px; margin:0 auto; border-radius:50%;
               border:4px solid #e4e4e7; border-top-color:#0891b2;
               animation:spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #offline { display:none; }
  </style>
</head>
<body>
  <!--
    CP-76 → CP-92 rewrite. This page is Capacitor's errorPath: it appears
    whenever the webview load "fails". Two problems with the old version:

      1. iOS fires didFailProvisionalNavigation for CANCELLED navigations
         too (NSURLErrorDomain -999 — two navigations racing, e.g. the
         /join boot redirect), so this screen showed while the network was
         perfectly fine. Andrew hit this repeatedly; closing and reopening
         the app "fixed" it because nothing was ever wrong.
      2. It was a dead end — a static wall with a manual button.

    Now it self-heals: it immediately probes the live app and bounces back
    the moment it's reachable. The spurious -999 case recovers in under a
    second, usually before the user can read anything. Only after several
    failed probes does the offline copy appear (store reviewers still see
    a proper offline state in airplane mode).
  -->
  <div class="card">
    <div id="reconnecting">
      <div class="spinner"></div>
      <h1 style="font-size:1.1rem;margin:1rem 0 0">Loading…</h1>
    </div>
    <div id="offline">
      <div style="font-size:44px">📡</div>
      <h1 style="font-size:1.2rem;margin:.5rem 0 0">You're offline</h1>
      <p style="color:#71717a;font-size:.9rem">Atlas Rewards needs an internet connection to load your points and rewards. We'll reconnect automatically.</p>
      <button onclick="tryNow()">Try again</button>
    </div>
  </div>
  <script>
    var APP_URL = "https://www.atlas-engine.app/join";
    var fails = 0;
    var probing = false;

    function backToApp() { window.location.replace(APP_URL); }

    function probe() {
      if (probing) return;
      probing = true;
      var ctl = new AbortController();
      var kill = setTimeout(function () { ctl.abort(); }, 5000);
      // no-cors: an opaque response still proves the server is reachable.
      fetch(APP_URL, { method: "HEAD", mode: "no-cors", cache: "no-store", signal: ctl.signal })
        .then(function () { clearTimeout(kill); backToApp(); })
        .catch(function () {
          clearTimeout(kill);
          probing = false;
          fails++;
          // After ~3 failed probes (~8s), admit we're offline — but keep
          // probing in the background so recovery is still automatic.
          if (fails >= 3) {
            document.getElementById("reconnecting").style.display = "none";
            document.getElementById("offline").style.display = "block";
          }
          setTimeout(probe, Math.min(2500 + fails * 500, 6000));
        });
    }

    function tryNow() { fails = 0; probe(); }

    // The OS tells us the network came back → retry immediately.
    window.addEventListener("online", tryNow);
    probe();
  </script>
</body>
</html>
