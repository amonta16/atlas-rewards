<!doctype html>
<!--
  CP-262 · Occasion art for automated offers (Desk → Journey → Automated offers).
  One illustrated card per occasion, 1000×600 (5:3, the patient app's scratch-card shape):
  a hero scene for the occasion on the right, a hand-drawn doodle pattern behind it, bold
  outlines and flat colour. Open art.html?slug=halloween to see one; render.mjs writes
  public/offer-art/<slug>.jpg. Everything is drawn here, no photos or outside art.
  Keep the bottom-left (x < 480, y > 380) calm: the patient's name tag is drawn there.
-->
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#000}svg{display:block}</style></head>
<body><div id="one"></div>
<script>
const W = 1000, H = 600;

/* ── helpers ────────────────────────────────────────────────── */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const seedOf = (str) => [...str].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const f = (n) => (+n).toFixed(1);
/** outlined shape attributes */
const S = (fill, o, w = 7) => `fill="${fill}" stroke="${o}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const L = (o, w = 7) => `fill="none" stroke="${o}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const gloss = (d, w = 9, op = .85) => `<path d="${d}" fill="none" stroke="#fff" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`;
const heartD = (cx, cy, s) => `M${f(cx)} ${f(cy + .6 * s)} C${f(cx - 1.1 * s)} ${f(cy - .1 * s)},${f(cx - .55 * s)} ${f(cy - .95 * s)},${f(cx)} ${f(cy - .35 * s)} C${f(cx + .55 * s)} ${f(cy - .95 * s)},${f(cx + 1.1 * s)} ${f(cy - .1 * s)},${f(cx)} ${f(cy + .6 * s)}Z`;
const starD = (cx, cy, r, inner = .45, pts = 5, rot = -90) => { let p = ""; for (let i = 0; i < pts * 2; i++) { const a = (rot + i * 180 / pts) * Math.PI / 180, rr = i % 2 ? r * inner : r; p += `${i ? "L" : "M"}${f(cx + Math.cos(a) * rr)} ${f(cy + Math.sin(a) * rr)}`; } return p + "Z"; };
const sparkleD = (cx, cy, r) => `M${cx} ${cy - r} Q${cx + r * .14} ${cy - r * .14} ${cx + r} ${cy} Q${cx + r * .14} ${cy + r * .14} ${cx} ${cy + r} Q${cx - r * .14} ${cy + r * .14} ${cx - r} ${cy} Q${cx - r * .14} ${cy - r * .14} ${cx} ${cy - r}Z`;
const sparkle = (cx, cy, r, c, o) => `<path d="${sparkleD(cx, cy, r)}" ${o ? S(c, o, 5) : `fill="${c}"`}/>`;

/* Doodles: hand-drawn outline motifs scattered behind the scene (jittered grid, so it never looks tiled). */
const DOODLE = {
  heart: (c) => `<path d="M0 12 C-20 -2,-14 -20,0 -8 C14 -20,20 -2,0 12" ${L(c, 4.5)}/>`,
  heartLoop: (c) => `<path d="M-2 14 C-24 -2,-14 -22,0 -8 C12 -22,26 -4,2 14 C-6 20,-14 24,-20 30" ${L(c, 4.5)}/>`,
  star: (c) => `<path d="${starD(0, 0, 16)}" ${L(c, 4)}/>`,
  sparkle: (c) => `<path d="${sparkleD(0, 0, 15)}" ${L(c, 4)}/>`,
  snow: (c) => { let s = ""; for (let i = 0; i < 6; i++) s += `<g transform="rotate(${i * 60})"><path d="M0 0V-17M0 -11l-5 -5M0 -11l5 -5" ${L(c, 4)}/></g>`; return s; },
  clover: (c) => `<path d="M0 0 C-6 -18,-24 -16,-16 -4 C-24 2,-14 12,0 0 C14 12,24 2,16 -4 C24 -16,6 -18,0 0 C-8 8,-6 20,0 14 C6 20,8 8,0 0 M2 10 Q6 20,12 26" ${L(c, 4)}/>`,
  flower: (c) => { let s = ""; for (let i = 0; i < 5; i++) s += `<ellipse cy="-11" rx="6.5" ry="10" transform="rotate(${i * 72})" ${L(c, 4)}/>`; return s + `<circle r="4" ${L(c, 4)}/>`; },
  squiggle: (c) => `<path d="M-22 0 q5.5 -10 11 0 t11 0 t11 0 t11 0" ${L(c, 4.5)}/>`,
  dot: (c) => `<circle r="5" fill="${c}"/>`,
  ring: (c) => `<circle r="9" ${L(c, 4)}/>`,
  tag: (c) => `<path d="M-18 -12 H8 L20 0 L8 12 H-18 Z" ${L(c, 4)}/><circle cx="8" r="3" fill="${c}"/>`,
  percent: (c) => `<text font-family="Segoe UI,Arial" font-weight="800" font-size="34" text-anchor="middle" dominant-baseline="central" fill="none" stroke="${c}" stroke-width="2.5">%</text>`,
  cloud: (c) => `<path d="M-22 8 A10 10 0 0 1 -14 -8 A13 13 0 0 1 10 -10 A10 10 0 0 1 22 8 Z" ${L(c, 4)}/>`,
  wave: (c) => `<path d="M-24 0 C-16 -10,-8 -10,0 0 S16 10,24 0" ${L(c, 4.5)}/>`,
  sun: (c) => { let s = `<circle r="8" ${L(c, 4)}/>`; for (let i = 0; i < 8; i++) s += `<path d="M0 -13V-19" transform="rotate(${i * 45})" ${L(c, 4)}/>`; return s; },
  bat: (c) => `<path d="M0 -2 C-3 -7,-6 -4,-8 -4 C-12 -8,-18 -6,-22 -2 C-18 -2,-16 2,-14 5 C-11 2,-8 3,-6 6 C-4 3,-2 3,0 5 C2 3,4 3,6 6 C8 3,11 2,14 5 C16 2,18 -2,22 -2 C18 -6,12 -8,8 -4 C6 -4,3 -7,0 -2Z" fill="${c}"/>`,
  egg: (c) => `<ellipse rx="12" ry="16" ${L(c, 4)}/><path d="M-11 -1 l4.5 -4 4.5 4 4.5 -4 4.5 4 4 -3" ${L(c, 3.5)}/>`,
  coin: (c) => `<circle r="12" ${L(c, 4)}/><circle r="6" ${L(c, 3)}/>`,
};
function doodles(seed, kinds, color, step = 118, opacity = .5) {
  const r = rng(seed); let out = "";
  for (let y = -40, row = 0; y < H + 60; y += step * .82, row++) {
    for (let x = -40 + (row % 2 ? step / 2 : 0); x < W + 60; x += step) {
      const px = x + (r() - .5) * step * .5, py = y + (r() - .5) * step * .5, k = kinds[Math.floor(r() * kinds.length)];
      out += `<g transform="translate(${f(px)} ${f(py)}) rotate(${f((r() - .5) * 70)}) scale(${f(1.5 + r() * .8)})">${DOODLE[k](color)}</g>`;
    }
  }
  return `<g opacity="${opacity}">${out}</g>`;
}

/* ── scenes (each returns the hero, drawn around x≈700, y≈300) ─────────────── */

function cake(o) {
  const drips = (x, y, w, c) => {
    const n = Math.max(3, Math.round(w / 46)), seg = w / n, lens = [26, 10, 40, 16, 32, 12, 36];
    let d = `M${x} ${y + 16} Q${x} ${y} ${x + 16} ${y} H${x + w - 16} Q${x + w} ${y} ${x + w} ${y + 16} V${y + 26}`;
    for (let i = 0; i < n; i++) { const right = x + w - i * seg, mid = right - seg / 2, len = lens[i % lens.length]; d += ` L${f(mid + 11)} ${y + 26} V${y + 26 + len} A11 11 0 0 1 ${f(mid - 11)} ${y + 26 + len} V${y + 26}`; }
    return `<path d="${d} L${x} ${y + 26} Z" ${S(c, o)}/>`;
  };
  const sprinkles = (x0, y0, w, h, seed) => { const r = rng(seed), cs = ["#ff5d8f", "#4cc9f0", "#ffd166", "#7bd389", "#9b5de5"]; let s = ""; for (let i = 0; i < 16; i++) { const x = x0 + r() * w, y = y0 + r() * h; s += `<rect x="${f(x)}" y="${f(y)}" width="16" height="6" rx="3" fill="${cs[i % cs.length]}" transform="rotate(${f(r() * 180)} ${f(x + 8)} ${f(y + 3)})"/>`; } return s; };
  const candle = (x, c) => `<rect x="${x - 11}" y="150" width="22" height="84" rx="6" ${S("#fff", o, 6)}/><path d="M${x - 11} 172 l22 -12 M${x - 11} 196 l22 -12 M${x - 11} 220 l22 -12" stroke="${c}" stroke-width="7"/><rect x="${x - 11}" y="150" width="22" height="84" rx="6" ${L(o, 6)}/>
    <path d="M${x} 150 V138" ${L(o, 5)}/><path d="M${x} 92 C${x + 22} 116,${x + 16} 140,${x} 140 C${x - 16} 140,${x - 22} 116,${x} 92Z" ${S("#ffb703", o, 5)}/><path d="M${x} 112 C${x + 9} 124,${x + 6} 134,${x} 134 C${x - 6} 134,${x - 9} 124,${x} 112Z" fill="#fff3b0"/>`;
  return `
  <!-- balloon -->
  <path d="M905 262 C900 330,930 380,905 450" ${L(o, 4)}/>
  <ellipse cx="905" cy="170" rx="70" ry="86" ${S("#ffd166", o)}/><path d="M897 255 l8 10 l8 -10Z" ${S("#ffd166", o, 5)}/>${gloss("M868 120 Q880 104 898 100", 9)}
  <ellipse cx="700" cy="508" rx="230" ry="30" ${S("#ffffff", o)}/>
  <rect x="525" y="330" width="350" height="170" rx="26" ${S("#ffe8d6", o)}/>
  ${sprinkles(550, 400, 300, 80, 3)}
  ${drips(525, 330, 350, "#ff5d8f")}
  <rect x="595" y="230" width="210" height="112" rx="22" ${S("#9b5de5", o)}/>
  ${sprinkles(615, 290, 170, 40, 9)}
  ${drips(595, 230, 210, "#ffffff")}
  ${candle(645, "#ff5d8f")}${candle(700, "#4cc9f0")}${candle(755, "#ffd166")}
  ${gloss("M548 372 V430", 8, .7)}`;
}

function giftBox(o) {
  const teal = "#26a69a", tealD = "#1c7f76", yel = "#ffd166";
  return `
  ${sparkle(600, 225, 26, "#fff3b0", o)}${sparkle(800, 210, 34, "#fff3b0", o)}${sparkle(700, 160, 18, "#fff", o)}
  <path d="${heartD(655, 250, 26)}" ${S("#ff6b8b", o, 5)}/><path d="${heartD(752, 262, 20)}" ${S("#ff6b8b", o, 5)}/>
  <circle cx="560" cy="290" r="7" fill="#fff"/><circle cx="845" cy="290" r="8" fill="#fff"/><circle cx="728" cy="214" r="6" fill="#fff"/>
  <!-- box -->
  <rect x="560" y="318" width="290" height="208" rx="14" ${S(teal, o)}/>
  <rect x="675" y="318" width="60" height="208" ${S(yel, o)}/>
  <rect x="544" y="300" width="322" height="46" rx="10" ${S(tealD, o)}/>
  <rect x="675" y="300" width="60" height="46" ${S(yel, o)}/>
  ${gloss("M584 370 V480", 8, .55)}
  <!-- lid, flying off -->
  <g transform="translate(720 150) rotate(-16)">
    <path d="M-10 -52 C-60 -110,-120 -90,-98 -58 C-84 -40,-40 -44,-10 -52Z" ${S(yel, o)}/>
    <path d="M10 -52 C60 -110,120 -90,98 -58 C84 -40,40 -44,10 -52Z" ${S(yel, o)}/>
    <rect x="-172" y="-50" width="344" height="62" rx="12" ${S(teal, o)}/>
    <rect x="-32" y="-50" width="64" height="62" ${S(yel, o)}/>
    <rect x="-20" y="-70" width="40" height="34" rx="12" ${S(yel, o)}/>
    ${gloss("M-150 -32 H-70", 8, .6)}
  </g>`;
}

function flutes(o) {
  const flute = (x, rot) => `<g transform="translate(${x} 470) rotate(${rot})">
    <path d="M0 -14 V68" ${L(o, 9)}/><ellipse cx="0" cy="72" rx="44" ry="12" ${S("#f4ecff", o)}/>
    <path d="M-38 -260 C-40 -150,-26 -36,0 -16 C26 -36,40 -150,38 -260 Z" ${S("#f4ecff", o)}/>
    <path d="M-37 -196 C-36 -120,-24 -42,0 -24 C24 -42,36 -120,37 -196 Z" fill="#ffc94d"/>
    <path d="M-37 -196 H37" ${L(o, 5)}/>
    <circle cx="-10" cy="-120" r="6" fill="#fff6d6"/><circle cx="8" cy="-80" r="5" fill="#fff6d6"/><circle cx="-4" cy="-160" r="4" fill="#fff6d6"/><circle cx="12" cy="-140" r="4" fill="#fff6d6"/>
    <path d="M-38 -260 C-40 -150,-26 -36,0 -16 C26 -36,40 -150,38 -260 Z" ${L(o)}/>
    ${gloss("M-24 -240 C-26 -170,-20 -110,-12 -76", 7, .8)}
  </g>`;
  let rays = ""; for (let i = 0; i < 9; i++) { const a = (-160 + i * 17.5) * Math.PI / 180; rays += `<path d="M${f(700 + Math.cos(a) * 46)} ${f(192 + Math.sin(a) * 46)} L${f(700 + Math.cos(a) * 92)} ${f(192 + Math.sin(a) * 92)}" ${L("#ffd166", 8)}/>`; }
  return `${rays}${flute(640, 14)}${flute(760, -14)}
  ${sparkle(560, 170, 22, "#ffd166", o)}${sparkle(850, 140, 28, "#ffd166", o)}${sparkle(880, 330, 16, "#fff", o)}
  <path d="${heartD(565, 330, 22)}" ${S("#ff6b8b", o, 5)}/>`;
}

function plane(o) {
  return `
  <path d="M250 150 C330 40,470 70,452 160 C436 238,330 210,370 150 C420 80,520 230,598 296" fill="none" stroke="#fff" stroke-width="7" stroke-dasharray="2 22" stroke-linecap="round"/>
  <path d="${heartD(300, 92, 26)}" ${S("#ff6b8b", o, 5)}/><path d="${heartD(500, 210, 18)}" ${S("#ff6b8b", o, 5)}/>
  <!-- paper airplane -->
  <path d="M600 300 L930 120 L700 340 Z" ${S("#ffffff", o)}/>
  <path d="M700 340 L930 120 L728 420 Z" ${S("#dcd6ff", o)}/>
  <path d="M700 340 L930 120 L800 330 Z" ${S("#f3f0ff", o)}/>
  <path d="M700 340 L728 420" ${L(o, 7)}/>
  ${gloss("M640 296 L860 172", 7, .7)}
  <!-- clouds -->
  <path d="M640 500 A30 30 0 0 1 668 452 A42 42 0 0 1 746 444 A32 32 0 0 1 800 500 Z" ${S("#ffffff", o)}/>
  <path d="M820 270 A20 20 0 0 1 840 238 A28 28 0 0 1 892 232 A22 22 0 0 1 930 270 Z" ${S("#ffffff", o, 6)}/>
  ${sparkle(880, 420, 20, "#fff3b0", o)}`;
}

function popper(o) {
  const r = rng(41), cs = ["#ffd166", "#ff5d8f", "#4cc9f0", "#7bd389", "#ffffff", "#9b5de5"];
  let conf = "";
  for (let i = 0; i < 46; i++) {
    const a = (-165 + r() * 120) * Math.PI / 180, d = 90 + r() * 300, x = 690 + Math.cos(a) * d, y = 300 + Math.sin(a) * d * .9;
    if (y > 360 && x < 500) continue;
    const c = cs[i % cs.length], k = r();
    conf += k < .45 ? `<rect x="${f(x)}" y="${f(y)}" width="26" height="12" rx="3" ${S(c, o, 4)} transform="rotate(${f(r() * 180)} ${f(x + 13)} ${f(y + 6)})"/>`
      : k < .75 ? `<circle cx="${f(x)}" cy="${f(y)}" r="${f(7 + r() * 6)}" ${S(c, o, 4)}/>`
      : `<path d="${starD(x, y, 14)}" ${S(c, o, 4)}/>`;
  }
  const streamer = (d, c) => `<path d="${d}" ${L(o, 17)}/><path d="${d}" ${L(c, 9)}/>`;
  return `${streamer("M690 300 C640 230,700 190,650 140 S600 60,560 70", "#ff5d8f")}
  ${streamer("M690 300 C620 290,600 230,540 240 S470 200,440 160", "#4cc9f0")}
  ${streamer("M690 300 C720 220,790 230,780 150 S820 70,860 60", "#ffd166")}
  ${conf}
  <g transform="translate(700 300) rotate(-40)">
    <defs><clipPath id="cone"><path d="M-84 0 L0 250 L84 0 Z"/></clipPath></defs>
    <path d="M-84 0 L0 250 L84 0 Z" fill="#ffffff"/>
    <g clip-path="url(#cone)">${[0, 1, 2, 3, 4, 5].map((i) => `<path d="M-120 ${i * 50 + 8} L120 ${i * 50 - 40} V${i * 50 - 16} L-120 ${i * 50 + 32}Z" fill="#3d5af1"/>`).join("")}</g>
    <path d="M-84 0 L0 250 L84 0 Z" ${L(o)}/>
    <ellipse cx="0" cy="0" rx="86" ry="26" ${S("#ffd166", o)}/><ellipse cx="0" cy="0" rx="62" ry="14" fill="${o}" opacity=".85"/>
  </g>`;
}

function bags(o) {
  const gold = "#d9b26a", bag = (x, y, w, h, rot, fill, line) => `<g transform="rotate(${rot} ${x + w / 2} ${y + h})">
    <path d="M${x + w * .28} ${y + 4} C${x + w * .28} ${y - 70},${x + w * .72} ${y - 70},${x + w * .72} ${y + 4}" ${L(line, 9)}/>
    <path d="M${x} ${y} H${x + w} L${x + w + 14} ${y + h} H${x - 14} Z" ${S(fill, line, 6)}/>
    <path d="M${x + w * .2} ${y + 34} H${x + w * .8}" ${L(line, 4)} opacity=".5"/>
  </g>`;
  return `${bag(560, 210, 200, 250, -8, gold, "#0b0b0c")}
  ${bag(690, 250, 220, 260, 6, "#2a2a31", gold)}
  <!-- hang tag -->
  <path d="M770 200 C760 240,770 280,786 312" ${L(gold, 4)}/>
  <g transform="rotate(18 800 360)">
    <path d="M748 320 H840 L872 360 L840 400 H748 Q736 400 736 388 V332 Q736 320 748 320Z" ${S("#f6efe0", "#0b0b0c", 6)}/>
    <circle cx="846" cy="360" r="8" ${S("#2a2a31", "#0b0b0c", 4)}/>
    <text x="790" y="362" font-family="Segoe UI,Arial" font-weight="900" font-size="58" text-anchor="middle" dominant-baseline="central" fill="#1a1a1f">%</text>
  </g>
  ${sparkle(560, 160, 22, gold)}${sparkle(905, 190, 30, gold)}${sparkle(930, 470, 16, gold)}`;
}

function ornaments(o) {
  const orn = (cx, cy, r, c, band, decor) => {
    const top = cy - r;
    return `<path d="M${cx} -10 V${top - 26}" ${L(o, 4)}/><path d="M${cx - 12} ${top - 30} a12 12 0 0 1 24 0" ${L(o, 5)}/>
      <rect x="${cx - r * .28}" y="${top - 24}" width="${r * .56}" height="30" rx="6" ${S("#f2c14e", o, 6)}/>
      <defs><clipPath id="b${cx}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>
      <g clip-path="url(#b${cx})">${decor(cx, cy, r, band)}</g>
      <circle cx="${cx}" cy="${cy}" r="${r}" ${L(o)}/>
      ${gloss(`M${cx - r * .62} ${cy - r * .2} A${r * .66} ${r * .66} 0 0 1 ${cx - r * .2} ${cy - r * .62}`, 10, .8)}`;
  };
  const zig = (cx, cy, r, c) => { let d = `M${cx - r} ${cy - 10}`; for (let x = cx - r; x < cx + r; x += 24) d += ` L${x + 12} ${cy + 12} L${x + 24} ${cy - 10}`; return `<rect x="${cx - r}" y="${cy - 26}" width="${2 * r}" height="52" fill="${c}"/><path d="${d}" ${L("#b3122e", 6)}/><path d="M${cx - r} ${cy - 26} H${cx + r} M${cx - r} ${cy + 26} H${cx + r}" ${L("#0a2e22", 5)}/>`; };
  const dots = (cx, cy, r, c) => { let s = ""; for (let y = cy - r; y < cy + r; y += 34) for (let x = cx - r + ((y / 34) % 2 ? 17 : 0); x < cx + r; x += 34) s += `<circle cx="${x}" cy="${y}" r="7" fill="${c}"/>`; return s; };
  const stripes = (cx, cy, r, c) => [-1, 0, 1].map((k) => `<path d="M${cx - r} ${cy + k * 40 + 14} Q${cx} ${cy + k * 40 - 10} ${cx + r} ${cy + k * 40 + 14}" ${L(c, 12)}/>`).join("");
  const leaf = (x, y, rot) => `<path d="M0 0 C10 -10,20 -6,24 -18 C30 -10,40 -12,44 -2 C36 2,34 12,44 20 C32 22,26 18,20 30 C14 20,8 14,0 0Z" transform="translate(${x} ${y}) rotate(${rot}) scale(1.6)" ${S("#2f9e5b", o, 4)}/>`;
  return `${orn(590, 230, 74, "#1f8a4c", "#f4f1ea", stripes)}
  ${orn(840, 210, 84, "#f4f1ea", "#1f8a4c", dots)}
  ${orn(715, 360, 118, "#f2c14e", "#f4f1ea", zig)}
  ${leaf(860, 420, 20)}${leaf(860, 420, 110)}<circle cx="866" cy="430" r="14" ${S("#e63946", o, 5)}/><circle cx="890" cy="414" r="12" ${S("#e63946", o, 5)}/><circle cx="886" cy="442" r="11" ${S("#e63946", o, 5)}/>
  ${sparkle(940, 340, 20, "#fff", o)}${sparkle(500, 120, 16, "#fff", o)}`;
}

function basket(o) {
  const egg = (cx, cy, rx, ry, rot, c, id, decor) => `<g transform="rotate(${rot} ${cx} ${cy})"><defs><clipPath id="${id}"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/></clipPath></defs>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c}"/><g clip-path="url(#${id})">${decor(cx, cy, rx, ry)}</g>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" ${L(o)}/>${gloss(`M${cx - rx * .55} ${cy - ry * .3} Q${cx - rx * .45} ${cy - ry * .7} ${cx - rx * .1} ${cy - ry * .82}`, 8, .7)}</g>`;
  const zigD = (cx, y, rx) => { let d = `M${cx - rx} ${y}`; for (let x = cx - rx; x < cx + rx; x += 22) d += ` L${x + 11} ${y - 16} L${x + 22} ${y}`; return d; };
  const zz = (cx, cy, rx) => `<path d="${zigD(cx, cy, rx)}" ${L("#fff", 9)}/><path d="${zigD(cx, cy + 40, rx)}" ${L("#9b5de5", 7)}/><path d="${zigD(cx, cy - 40, rx)}" ${L("#ff8fab", 7)}/>`;
  const dd = (cx, cy, rx, ry) => { let s = ""; for (let y = cy - ry; y < cy + ry; y += 30) for (let x = cx - rx + ((Math.round(y) / 30) % 2 ? 15 : 0); x < cx + rx; x += 30) s += `<circle cx="${x}" cy="${y}" r="7" fill="#fff"/>`; return s + `<path d="M${cx - rx} ${cy + 6} H${cx + rx}" ${L("#ff5d8f", 12)}/>`; };
  const ss = (cx, cy, rx) => [-36, 0, 36].map((k, i) => `<path d="M${cx - rx} ${cy + k} H${cx + rx}" ${L(["#ffd166", "#ffffff", "#ff8fab"][i], 12)}/>`).join("");
  let weave = `<defs><clipPath id="bk"><path d="M566 400 L854 400 L816 548 L604 548 Z"/></clipPath></defs><g clip-path="url(#bk)">`;
  for (let x = 560; x < 870; x += 30) weave += `<path d="M${x} 400 L${x + (x - 710) * -.13} 550" ${L("#a8682e", 5)}/>`;

function card(slug) {
  const t = T[slug]; if (!t) return "";
  const s = seedOf(slug);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
  <defs>
    <radialGradient id="bg" cx=".68" cy=".42" r=".85"><stop offset="0" stop-color="${t.bg[0]}"/><stop offset="1" stop-color="${t.bg[1]}"/></radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="${s % 97}"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#bg)"/>
  ${doodles(s, t.d[0], t.d[1])}
  <g filter="url(#lift)"><g transform="translate(700 320) scale(${t.z ?? 1}) translate(-700 -320)">${t.hero(t.o)}</g></g>
  <rect width="${W}" height="${H}" fill="#808080" filter="url(#grain)" opacity=".07" style="mix-blend-mode:overlay"/>
</svg>`;
}
